[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courier-tracking-api"
version = "0.1.0"
description = "One JSON API over public Indian courier tracking pages (currently Trackon). Demonstration project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "beautifulsoup4>=4.12",
    "mcp>=2.2,<3",
]

[project.scripts]
courier-tracking-mcp = "courier_tracking.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["courier_tracking"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
